<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="CSS/joining.css">
</head>
<body>
    <div class="container-form">
        <form th:action="@{/reset-password}" method="POST">
            <div th:if="${errorMessage}" style="color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; text-align: center;">
                ⚠️ <span th:text="${errorMessage}">Error Message</span>
            </div>
            <div th:if="${successMessage}" style="color: #155724; background-color: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; text-align: center;">
                ✅ <span th:text="${successMessage}">Success Message</span>
            </div>

            <h1>MBEYA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
            <img src="must.png">
            <h2>Reset your password</h2>

            <label for="registration_number">Registration Number:</label><br>
            <input type="text" id="registration_number" name="registration_number" required><br><br>

            <label for="email">Enter your signup email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="new_password">New password:</label><br>
            <input type="password" id="new_password" name="new_password" required minlength="6"><br><br>

            <label for="confirm_new_password">repeat your password:</label><br>
            <input type="password" id="confirm_new_password" name="confirm_new_password" required minlength="6"><br><br>

            <input type="submit" value="Badilisha Password" style="background-color:rgb(60, 141, 60)">
            <p><a th:href="@{/form}">Back to Login</a></p>
        </form>
    </div>
</body>
</html>
